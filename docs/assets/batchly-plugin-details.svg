    <g transform="translate(410 326)"><rect width="300" height="154" rx="16" fill="#F7F9FD" stroke="#DCE3F0"/><rect x="22" y="24" width="42" height="42" rx="10" fill="#1769FF"/><path d="M34 38h18v14H34zM38 33h18v14" fill="none" stroke="#FFF" stroke-width="3" stroke-linejoin="round"/><text x="22" y="92" fill="#07142F" font-size="19" font-weight="700">Reliable job queues</text><text x="22" y="120" fill="#61708B" font-size="15">Schedule and process work</text><text x="22" y="141" fill="#61708B" font-size="15">predictably.</text></g>
    <g transform="translate(88 502)"><rect width="300" height="154" rx="16" fill="#F7F9FD" stroke="#DCE3F0"/><rect x="22" y="24" width="42" height="42" rx="10" fill="#7657FF"/><path d="M32 52l8-9 7 6 9-14" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="92" fill="#07142F" font-size="19" font-weight="700">Live monitoring</text><text x="22" y="120" fill="#61708B" font-size="15">Track active work, progress,</text><text x="22" y="141" fill="#61708B" font-size="15">and outcomes.</text></g>
